<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiny Orb - Journey of Seasons</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Protocol Warning Banner -->
    <div id="fileProtocolWarning" class="warning-banner hidden">
        ⚠️ Audio playback may be restricted when running directly via file:// protocol. Please open using a local server (e.g., VS Code Live Server).
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen Overlay -->
    <div id="startScreen" class="overlay active">
        <h1>Tiny Orb</h1>
        <p>Tap or Click to fly. Avoid obstacles and don't hit the ground!</p>
        <button id="startBtn">Start Journey</button>
    </div>

    <!-- Game Over Screen Overlay -->
    <div id="gameOverScreen" class="overlay">
        <h1>Game Over</h1>
        <p>You survived for <span id="finalScore">0</span> Days</p>
        <button id="restartBtn">Restart Journey</button>
    </div>

    <!-- In-Game HUD -->
    <div id="hud">
        <div class="hud-left">
            <h2><span id="scoreDisplay">0</span> Days</h2>
        </div>
        <div class="hud-right">
            <h3 id="seasonDisplay">Spring</h3>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
